name: bootstrap-project

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["bootstrap/**"]

permissions:
  issues: write
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('bootstrap/issues.json', 'utf8'));
            const { owner, repo } = context.repo;

            for (const l of data.labels) {
              try { await github.rest.issues.createLabel({ owner, repo, ...l }); core.info(`label ${l.name}`); }
              catch (e) { if (e.status !== 422) throw e; core.info(`label ${l.name} exists`); }
            }

            const msNumbers = {};
            const existing = await github.paginate(github.rest.issues.listMilestones, { owner, repo, state: 'all' });
            for (const m of data.milestones) {
              const found = existing.find(x => x.title === m.title);
              if (found) { msNumbers[m.title] = found.number; core.info(`milestone ${m.title} exists`); continue; }
              const r = await github.rest.issues.createMilestone({ owner, repo, title: m.title, description: m.description });
              msNumbers[m.title] = r.data.number; core.info(`milestone ${m.title}`);
            }

            const existingIssues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all' });
            const titles = new Set(existingIssues.map(i => i.title));
            for (const i of data.issues) {
              if (titles.has(i.title)) { core.info(`issue exists: ${i.title}`); continue; }
              await github.rest.issues.create({ owner, repo, title: i.title, body: i.body, labels: i.labels, milestone: msNumbers[i.milestone] });
              core.info(`issue: ${i.title}`);
              await new Promise(r => setTimeout(r, 1200));
            }
